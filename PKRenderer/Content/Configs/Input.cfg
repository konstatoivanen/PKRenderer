InputConfig:
    OpenConsole: GraveAccent
    FlyCamera:
        Forward: W
        Backward: S
        Left: A
        Right: D
        Up: Q
        Down: E
        LookDrag: Mouse2
        SpeedUp: MouseScrollUp
        SpeedDown: MouseScrollDown
        FovAdd: MouseScrollDown
        FovSub: MouseScrollUp
        FovControl: LeftControl
        ResetSmoothing: LeftShift
        DollyZoom: LeftShift
    GUIKeys:
        Enter:
            - Mouse1
            - Enter
        Exit: [LeftShift,Tab]
        Shift:
            - LeftShift
            - RightShift
        Control:
            - LeftControl
            - RightControl
        Up: Up
        Down: Down
        Left: Left
        Right: Right
        Text_Backspace: Backspace
        Text_Delete: Del
        Text_Begin: Home
        Text_End: End
        Text_Cut: [LeftControl, X]
        Text_Copy: [LeftControl, C]
        Text_Paste: [LeftControl, V]
        Text_SelectAll: [LeftControl, A]
    KeyCommands:
        - Key: Escape
          Command: "Application.Close"
        - Key: F11
          Command: "Application.Fullscreen.Toggle"
        - Key: R
          Command: "AssetDatabase.Reload.Cached.All.ShaderAsset"
        - Key: C
          Command: "AssetDatabase.Reload.Cached.All.EngineDebugConfig"
        - Key: Z
          Command: "AssetDatabase.Reload.Cached.All.InputKeyConfig"
        - Key: X
          Command: "Application.Run.Executable PKAssetTools.exe '../../PKRenderer/Content/' 'Content/'"
        - Key: V
          Command: "Application.VSync.Cycle"
        - Key: M
          Command: "RHI.Query.Memory"
        - Key: T
          Command: "Time.Reset"
        - Key: Y
          Command: "Engine.FlyCamera.Transforms.Log"
        - Key: U
          Command: "Engine.FlyCamera.Transforms.Reset"
        - Key: I
          Command: "Engine.Profiler.Toggle"
        - Key: G
          Command: "Engine.Gizmos.CPU.Toggle"
        - Key: H
          Command: "Engine.Gizmos.GPU.Toggle"
        - Key: F
          Command: "Engine.Screenshot.QueueCapture"
        - Key: J
          Command: "Renderer.SceneEnv.ForceCapture"
